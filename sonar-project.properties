# ==============================================================================
# SonarCloud Scanner Configuration (sonar-project.properties)
# Target: https://sonarcloud.io (Cloud SAST & Quality Gate)
# ==============================================================================

# SonarCloud Host & Organization
sonar.host.url=https://sonarcloud.io
sonar.organization=swildz

# Project Key and Display Name
sonar.projectKey=Swildz_DevSecOpsIndico
sonar.projectName=DevSecOpsIndico
sonar.projectVersion=1.0.0

# Source and Test File Paths
sonar.sources=app/src
sonar.tests=
sonar.sourceEncoding=UTF-8

# Language Specification
sonar.language=py
sonar.python.version=3.11

# Exclusions (Avoid scanning libraries, generated files, and infrastructure)
sonar.exclusions=**/__pycache__/**,**/*.pyc,evidence/**,terraform/**,architecture/**

# Quality Gate Enforcement
# When enabled in CI/CD, the scanner waits for SonarCloud Quality Gate computation
sonar.qualitygate.wait=true
