# ==============================================================================
# SonarQube Scanner Configuration (sonar-project.properties)
# Standard: Enterprise SAST & Code Quality Gate
# ==============================================================================

# Unique Project Key and Display Name
sonar.projectKey=indico-devsecops-backend-api
sonar.projectName=Indico DevSecOps Backend API
sonar.projectVersion=1.0.0

# Source and Test File Paths
sonar.sources=app/src
sonar.tests=
sonar.sourceEncoding=UTF-8

# Language Specification
sonar.language=py
sonar.python.version=3.11

# Exclusions (Avoid scanning libraries, generated files, and infrastructure)
sonar.exclusions=**/__pycache__/**,**/*.pyc,evidence/**,terraform/**,architecture/**

# Quality Gate Enforcement
# When enabled in CI/CD, the scanner waits for SonarQube Quality Gate computation
sonar.qualitygate.wait=true
