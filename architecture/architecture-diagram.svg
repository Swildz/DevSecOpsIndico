<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pubSubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="privSubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="isoSubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#headerGrad)">AWS DevSecOps Secure Architecture - Backend API on AWS Fargate</text>
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#94a3b8">Multi-AZ Defense-in-Depth Design with AWS WAF, PrivateLink Endpoints, and Zero-Trust IAM</text>

  <!-- External Internet & Client -->
  <g transform="translate(40, 100)">
    <rect width="130" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="65" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">Internet Clients</text>
    <text x="65" y="52" text-anchor="middle" font-size="11" fill="#94a3b8">Public Web / Mobile</text>
    <text x="65" y="70" text-anchor="middle" font-size="10" fill="#38bdf8">HTTPS / TLS 1.3</text>
  </g>

  <!-- Flow: Internet -> Route 53 / WAF -->
  <line x1="170" y1="145" x2="220" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge Tier (Route 53 + AWS WAF) -->
  <g transform="translate(225, 90)">
    <rect width="180" height="110" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.8"/>
    <rect x="10" y="8" width="160" height="24" rx="4" fill="#881337"/>
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#fecdd3">AWS EDGE SERVICES</text>
    <text x="90" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Amazon Route 53</text>
    <text x="90" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fda4af">AWS WAF (v2)</text>
    <text x="90" y="88" text-anchor="middle" font-size="10" fill="#cbd5e1">SQLi, XSS, Rate-Limit, CRS</text>
  </g>

  <!-- Flow: WAF -> ALB -->
  <line x1="405" y1="145" x2="455" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC Container -->
  <g transform="translate(460, 80)">
    <rect width="700" height="590" rx="12" fill="url(#vpcGrad)" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="6,4"/>
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#38bdf8">Amazon VPC (10.0.0.0/16) - ap-southeast-1</text>
    
    <!-- Public Subnets Box -->
    <g transform="translate(15, 38)">
      <rect width="670" height="95" rx="8" fill="url(#pubSubGrad)" stroke="#0284c7" stroke-width="1.2"/>
      <text x="15" y="20" font-size="11" font-weight="bold" fill="#38bdf8">Public Subnets (Multi-AZ) - Ingress: 0.0.0.0/0:443 only</text>
      
      <!-- ALB Component -->
      <rect x="160" y="30" width="350" height="52" rx="6" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="335" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Application Load Balancer (ALB)</text>
      <text x="335" y="69" text-anchor="middle" font-size="10" fill="#94a3b8">ACM TLS 1.3 Termination | HTTP->HTTPS Redirect | Health Check /healthz</text>
    </g>

    <!-- Flow: ALB -> ECS Fargate -->
    <line x1="335" y1="133" x2="335" y2="165" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Private Application Subnets Box -->
    <g transform="translate(15, 170)">
      <rect width="670" height="150" rx="8" fill="url(#privSubGrad)" stroke="#059669" stroke-width="1.2"/>
      <text x="15" y="20" font-size="11" font-weight="bold" fill="#34d399">Private Application Subnets (Multi-AZ) - No Public IPs | Ingress: ALB SG on 8080</text>
      
      <!-- ECS Task AZ-A -->
      <g transform="translate(50, 35)">
        <rect width="260" height="98" rx="6" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4"/>
        <text x="130" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#ecfdf5">ECS Fargate Task (AZ-A)</text>
        <text x="130" y="42" text-anchor="middle" font-size="10" fill="#6ee7b7">Container: Python/FastAPI (UID 10001)</text>
        <text x="130" y="58" text-anchor="middle" font-size="10" fill="#94a3b8">Read-Only Root FS | Dropped Capabilities</text>
        <text x="130" y="74" text-anchor="middle" font-size="10" fill="#cbd5e1">Listening on: :8080</text>
        <text x="130" y="90" text-anchor="middle" font-size="9" fill="#f59e0b">Task Role != Task Execution Role</text>
      </g>

      <!-- ECS Task AZ-B -->
      <g transform="translate(360, 35)">
        <rect width="260" height="98" rx="6" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4"/>
        <text x="130" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#ecfdf5">ECS Fargate Task (AZ-B)</text>
        <text x="130" y="42" text-anchor="middle" font-size="10" fill="#6ee7b7">Container: Python/FastAPI (UID 10001)</text>
        <text x="130" y="58" text-anchor="middle" font-size="10" fill="#94a3b8">Read-Only Root FS | Dropped Capabilities</text>
        <text x="130" y="74" text-anchor="middle" font-size="10" fill="#cbd5e1">Listening on: :8080</text>
        <text x="130" y="90" text-anchor="middle" font-size="9" fill="#f59e0b">Task Role != Task Execution Role</text>
      </g>
    </g>

    <!-- Flow: ECS -> Database -->
    <line x1="200" y1="320" x2="200" y2="350" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <line x1="470" y1="320" x2="470" y2="350" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Isolated Database Subnets Box -->
    <g transform="translate(15, 355)">
      <rect width="360" height="105" rx="8" fill="url(#isoSubGrad)" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="15" y="20" font-size="11" font-weight="bold" fill="#c084fc">Isolated Database Subnets - No Internet Route</text>
      
      <!-- RDS PostgreSQL Multi-AZ -->
      <g transform="translate(20, 32)">
        <rect width="320" height="60" rx="6" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2"/>
        <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Amazon RDS PostgreSQL (Multi-AZ)</text>
        <text x="160" y="42" text-anchor="middle" font-size="10" fill="#d8b4fe">Storage Encrypted via KMS CMK | Ingress: ECS SG only:5432</text>
      </g>
    </g>

    <!-- VPC Endpoints Box (AWS PrivateLink) -->
    <g transform="translate(390, 355)">
      <rect width="295" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#38bdf8">AWS PrivateLink VPC Endpoints</text>
      <text x="15" y="38" font-size="9" fill="#94a3b8">Zero-egress private API connectivity</text>

      <g transform="translate(15, 48)">
        <rect width="265" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="12" y="22" font-size="10" fill="#f8fafc">com.amazonaws.ecr.api / dkr</text>
      </g>
      <g transform="translate(15, 88)">
        <rect width="265" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="12" y="22" font-size="10" fill="#f8fafc">com.amazonaws.secretsmanager</text>
      </g>
      <g transform="translate(15, 128)">
        <rect width="265" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="12" y="22" font-size="10" fill="#f8fafc">com.amazonaws.kms</text>
      </g>
      <g transform="translate(15, 168)">
        <rect width="265" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="12" y="22" font-size="10" fill="#f8fafc">com.amazonaws.logs (CloudWatch)</text>
      </g>
    </g>

    <!-- Supporting Security Services -->
    <g transform="translate(15, 470)">
      <rect width="360" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="15" y="20" font-size="11" font-weight="bold" fill="#fbbf24">Security &amp; Audit Services</text>
      <text x="20" y="42" font-size="10" fill="#fde68a">• AWS Secrets Manager: Dynamic encrypted credentials</text>
      <text x="20" y="60" font-size="10" fill="#fde68a">• AWS KMS: Customer Managed Key (CMK) rotation</text>
      <text x="20" y="78" font-size="10" fill="#fde68a">• AWS CloudTrail: Multi-region encrypted audit trail</text>
    </g>
  </g>

  <!-- CI/CD Security Pipeline Sidebar -->
  <g transform="translate(40, 230)">
    <rect width="395" height="440" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="15" y="12" width="365" height="26" rx="4" fill="#312e81"/>
    <text x="197" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#c7d2fe">AUTOMATED CI/CD DEVSECOPS PIPELINE</text>

    <!-- Stage 1 -->
    <g transform="translate(20, 50)">
      <circle cx="14" cy="14" r="10" fill="#4338ca"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#e0e7ff">Source Validation &amp; Formatting</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(20, 85)">
      <circle cx="14" cy="14" r="10" fill="#ef4444"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#fca5a5">Secret Scanning (Gitleaks) [Gate: Fail on Secret]</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(20, 120)">
      <circle cx="14" cy="14" r="10" fill="#f97316"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#fdba74">SAST Code Security (Semgrep) [Gate: Fail on High/Crit]</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(20, 155)">
      <circle cx="14" cy="14" r="10" fill="#eab308"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#fef08a">SCA Dependencies (Trivy / pip-audit)</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(20, 190)">
      <circle cx="14" cy="14" r="10" fill="#06b6d4"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#a5f3fc">IaC Scanning (Checkov) [Blocks 0.0.0.0/0 &amp; IAM *]</text>
    </g>

    <!-- Stage 6 -->
    <g transform="translate(20, 225)">
      <circle cx="14" cy="14" r="10" fill="#3b82f6"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">6</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#93c5fd">Docker Multi-Stage Build (Non-Root User)</text>
    </g>

    <!-- Stage 7 -->
    <g transform="translate(20, 260)">
      <circle cx="14" cy="14" r="10" fill="#dc2626"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">7</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#f87171">Container Vulnerability Scan (Trivy) [Fail Crit/High]</text>
    </g>

    <!-- Stage 8 -->
    <g transform="translate(20, 295)">
      <circle cx="14" cy="14" r="10" fill="#8b5cf6"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">8</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#c4b5fd">DAST Vulnerability Testing (OWASP ZAP)</text>
    </g>

    <!-- Stage 9 -->
    <g transform="translate(20, 330)">
      <circle cx="14" cy="14" r="10" fill="#10b981"/>
      <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">9</text>
      <text x="35" y="18" font-size="11" font-weight="bold" fill="#6ee7b7">Deployment Gate (Manual Approval / Protected Env)</text>
    </g>

    <!-- OIDC Note -->
    <rect x="20" y="370" width="355" height="55" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    <text x="30" y="390" font-size="10" font-weight="bold" fill="#a5b4fc">AWS IAM OIDC Federated Authentication:</text>
    <text x="30" y="405" font-size="9" fill="#94a3b8">• Zero static keys (No AWS_ACCESS_KEY_ID in secrets)</text>
    <text x="30" y="418" font-size="9" fill="#94a3b8">• Short-lived STS tokens restricted to repo/branch</text>
  </g>
</svg>
