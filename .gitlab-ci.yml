# ==============================================================================
# Enterprise DevSecOps CI/CD Pipeline (.gitlab-ci.yml)
# Target: Secure AWS Fargate Backend Deployment
# Security Gates: Gitleaks, Semgrep, Trivy (SCA & Container), Checkov, OWASP ZAP
# ==============================================================================

stages:
  - validate
  - secrets
  - sast
  - sca
  - iac
  - build
  - container-security
  - dast
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  APP_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  # OIDC Role ARN (Short-lived temporary STS credentials, NO static keys!)
  AWS_ROLE_ARN: "arn:aws:iam::858093958225:role/gitlab-ci-fargate-deployer"

default:
  interruptible: true

# ------------------------------------------------------------------------------
# Stage 1: Source Code Validation & Linting
# ------------------------------------------------------------------------------
source-lint:
  stage: validate
  image: python:3.11-slim
  script:
    - echo "===> [STAGE 1] Running source code formatting & syntax validation..."
    - pip install --no-cache-dir flake8 black
    - black --check app/src/
    - flake8 app/src/ --max-line-length=100
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 2: Secret Scanning (Gitleaks)
# Gate: MUST FAIL on ANY detected credentials or API keys.
# ------------------------------------------------------------------------------
secret-scan:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - echo "===> [STAGE 2] Running Gitleaks secret detection across git tree..."
    - gitleaks detect --source=. --config=.gitleaks.toml --verbose --report-path=evidence/gitleaks-report.json --redact
  artifacts:
    when: always
    paths:
      - evidence/gitleaks-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 3: SAST - Static Application Security Testing (Semgrep)
# Gate: MUST FAIL on HIGH or CRITICAL severity CWE findings.
# ------------------------------------------------------------------------------
sast-semgrep:
  stage: sast
  image: returntocorp/semgrep:latest
  script:
    - echo "===> [STAGE 3] Running SAST analysis via Semgrep..."
    - semgrep scan --config=auto --error --severity=ERROR --json --output=evidence/semgrep-report.json app/
  artifacts:
    when: always
    paths:
      - evidence/semgrep-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 4: SCA - Software Composition Analysis (Trivy / pip-audit)
# Gate: Blocks release on known vulnerabilities with available fixes.
# ------------------------------------------------------------------------------
sca-dependencies:
  stage: sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "===> [STAGE 4] Scanning third-party dependencies for CVEs..."
    - trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format json --output evidence/sca-trivy-report.json app/
  artifacts:
    when: always
    paths:
      - evidence/sca-trivy-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 5: IaC Security Scanning (Checkov)
# Gate: Blocks open 0.0.0.0/0 database exposure and wildcard IAM (*).
# ------------------------------------------------------------------------------
iac-checkov:
  stage: iac
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - echo "===> [STAGE 5] Scanning Terraform Infrastructure as Code (Checkov)..."
    - checkov -d terraform/ --framework terraform --output json --output-file-path evidence/ --soft-fail-on LOW,MEDIUM
  artifacts:
    when: always
    paths:
      - evidence/results_json.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 6: Docker Image Build (Multi-stage, unprivileged)
# ------------------------------------------------------------------------------
build-container:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "===> [STAGE 6] Building hardened multi-stage Docker container..."
    - docker build --no-cache -t "$APP_IMAGE" app/
    - docker save "$APP_IMAGE" -o app-image.tar
  artifacts:
    paths:
      - app-image.tar
    expire_in: 2 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 7: Container Vulnerability Scanning (Trivy)
# Gate: MUST FAIL on CRITICAL vulnerabilities in the built container image.
# ------------------------------------------------------------------------------
container-scan:
  stage: container-security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-container
  script:
    - echo "===> [STAGE 7] Scanning Docker container filesystem and OS packages..."
    - trivy image --input app-image.tar --exit-code 1 --severity CRITICAL --format json --output evidence/container-trivy-report.json
    - trivy image --input app-image.tar --severity HIGH,MEDIUM --format table
  artifacts:
    when: always
    paths:
      - evidence/container-trivy-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------------------------
# Stage 8: DAST - Dynamic Application Security Testing (OWASP ZAP)
# Simulates testing in an ephemeral staging/test container environment.
# ------------------------------------------------------------------------------
dast-scan:
  stage: dast
  image:
    name: zaproxy/zap-stable:latest
    entrypoint: [""]
  needs:
    - build-container
  script:
    - echo "===> [STAGE 8] Running OWASP ZAP Baseline DAST Scan against test endpoint..."
    - mkdir -p /zap/wrk evidence
    - zap-baseline.py -t "http://test-app:8080" -r zap-report.html -J evidence/zap-report.json -I || true
  artifacts:
    when: always
    paths:
      - evidence/zap-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# Stage 9: Deployment Approval & Staging Deployment (OIDC Authenticated)
# ------------------------------------------------------------------------------
deploy-staging:
  stage: deploy-staging
  image: amazon/aws-cli:latest
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.example.com
  script:
    - echo "===> [STAGE 9] Assuming AWS IAM Role via OIDC Web Identity..."
    - >
      STS_CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "GitLabCI-Deploy-$CI_JOB_ID"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 900
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$STS_CREDS" | cut -f1)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$STS_CREDS" | cut -f2)
    - export AWS_SESSION_TOKEN=$(echo "$STS_CREDS" | cut -f3)
    - echo "Successfully assumed short-lived AWS IAM Role. Updating ECS Staging Service..."
    - aws ecs update-service --cluster app-staging-cluster --service app-backend-api --force-new-deployment
  environment:
    name: staging
    url: https://staging-api.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# Stage 10: Production Deployment (Manual Gate / Protected Environment)
# ------------------------------------------------------------------------------
deploy-production:
  stage: deploy-production
  image: amazon/aws-cli:latest
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.example.com
  script:
    - echo "===> [STAGE 10] Deploying to AWS Production Fargate Cluster..."
    - >
      STS_CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "GitLabCI-ProdDeploy-$CI_JOB_ID"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 900
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$STS_CREDS" | cut -f1)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$STS_CREDS" | cut -f2)
    - export AWS_SESSION_TOKEN=$(echo "$STS_CREDS" | cut -f3)
    - aws ecs update-service --cluster indico-api-production-cluster --service indico-api-production-service --force-new-deployment
  environment:
    name: production
    url: https://api.example.com
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
